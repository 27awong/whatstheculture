<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's The Cultures Around?</title>
    <style>
        :root {
            --item-height: 80px;
            --accent: #007AFF;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #ffffff;
            margin: 0;
            color: #1c1c1e;
        }

        /* This wrapper centers the content vertically while keeping it stable */
        .main-content {
            margin-top: auto;
            margin-bottom: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .sentence-container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 25px;
            font-weight: 700;
            text-align: center;
            padding: 20px 40px;
        }

        .wheel-wrapper {
            position: relative;
            height: var(--item-height);
            width: 270px;
            overflow: hidden;
            border-bottom: 3px solid #f2f2f7;
        }

        /* NEW: Scroll indicators (little arrows) that hint at vertical movement */
        .wheel-wrapper::before {
            content: "▲";
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: var(--accent);
            opacity: 0.4;
            z-index: 2;
            pointer-events: none;
            transition: opacity 0.5s;
        }
        .wheel-wrapper::after {
            content: "▼";
            position: absolute;
            bottom: 2px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: var(--accent);
            opacity: 0.4;
            z-index: 2;
            pointer-events: none;
            transition: opacity 0.5s;
        }

        /* Class to hide indicators once user scrolls */
        .wheel-wrapper.user-scrolled::before,
        .wheel-wrapper.user-scrolled::after {
            opacity: 0;
        }

        /* Inner gradient over the arrows */
        .wheel-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, white, transparent 30%, transparent 70%, white);
            pointer-events: none;
            z-index: 1;
        }

        .wheel {
            height: 100%;
            overflow-y: scroll;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            scroll-behavior: smooth;
        }
        .wheel::-webkit-scrollbar { display: none; }

        .item {
            height: var(--item-height);
            display: flex;
            align-items: center;
            justify-content: center;
            scroll-snap-align: center;
            color: #d1d1d6;
            transition: color 0.3s, transform 0.3s;
        }

        .item.active {
            color: var(--accent);
            transform: scale(1.1);
        }

        #description-box {
            margin-top: 40px;
            max-width: 600px;
            padding: 20px 40px;
            line-height: 1.6;
            font-size: 20px;
            color: #3a3a3c;
            text-align: center;
            /* RESERVES SPACE: This prevents the layout from jumping */
            min-height: 200px;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            border-radius: 25px;
            border: none;
            background: #f2f2f7;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #e5e5ea; }
    </style>
</head>
<body>

<div class="main-content">
    <div class="sentence-container">
        <div class="search-section" style="text-align: center; margin-bottom: 10px;">
            <input type="text" id="mainSearch" placeholder="Search a topic or country...">
            <div id="suggestions" class="suggestions-list"></div>
        </div>
        <span>What's the culture around</span>
        <div class="wheel-wrapper" id="wrapper1">
            <div class="wheel-overlay"></div>
            <div class="wheel" id="wheel1"></div>
        </div>
        <span>in</span>
        <div class="wheel-wrapper" id="wrapper2">
            <div class="wheel-overlay"></div>
            <div class="wheel" id="wheel2"></div>
        </div>
        <span>?</span>
    </div>

    <button onclick="spin()">Spin</button>

    <div id="description-box">
        Scroll to discover cultural norms.
    </div>
</div>

<script>
    const cultures = [
        "Etiquette", "Clothing", "Alcohol", "Safety", "Tipping", "Dining",
        "Punctuality", "Religion", "Taboos", "Nature", "Greetings",
        "Personal Space", "Eye Contact", "Swearing", "Titles & Address",
        "Gift Giving", "Gender Norms", "Noise Levels", "Physical Touch",
        "Social Hierarchy", "Bargaining", "Photography", "Transportation",
        "Queueing", "Coffee & Tea", "Bill Paying", "Street Food", "Smoking",
        "Drinking Water", "Sustainability", "Relationships", "PDA", "Tattoos"
    ];

    let countries = [];
    let contentMap = {};

    const w1 = document.getElementById('wheel1');
    const w2 = document.getElementById('wheel2');
    const wrap1 = document.getElementById('wrapper1');
    const wrap2 = document.getElementById('wrapper2');
    const desc = document.getElementById('description-box');

    function build(el, items) {
        el.innerHTML = '';
        items.forEach(text => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerText = text;
            el.appendChild(div);
        });
    }

    function update(e) {
        if (countries.length === 0) return;

        // If this update was triggered by an actual user scroll event, hide arrows
        if (e && e.isTrusted) {
            if (e.currentTarget === w1) wrap1.classList.add('user-scrolled');
            if (e.currentTarget === w2) wrap2.classList.add('user-scrolled');
        }

        const activeIdx1 = Math.round(w1.scrollTop / 80);
        const activeIdx2 = Math.round(w2.scrollTop / 80);

        const selectedCulture = cultures[activeIdx1] || cultures[0];
        const selectedCountry = countries[activeIdx2] || countries[0];

        [w1, w2].forEach((wheel, wheelIndex) => {
            const items = wheel.querySelectorAll('.item');
            const currentIdx = (wheelIndex === 0) ? activeIdx1 : activeIdx2;
            items.forEach((item, i) => {
                item.className = (i === currentIdx) ? 'item active' : 'item';
            });
        });

        const key = `${selectedCulture}:${selectedCountry}`;

        if (contentMap[key]) {
            desc.innerHTML = contentMap[key];
        } else {
            desc.innerHTML = `Info for <strong>${selectedCulture}</strong> in <strong>${selectedCountry}</strong> is coming soon!`;
        }
    }

    function spin() {
        if (countries.length === 0) return;
        
        // Hide indicators if user clicks Spin
        wrap1.classList.add('user-scrolled');
        wrap2.classList.add('user-scrolled');

        const target1 = Math.floor(Math.random() * cultures.length);
        const target2 = Math.floor(Math.random() * countries.length);

        w1.scrollTo({ top: target1 * 80, behavior: 'smooth' });
        w2.scrollTo({ top: target2 * 80, behavior: 'smooth' });
    }

    // NEW: Nudges the wheel down slightly and back up to subtly catch user's attention
    function nudgeWheels() {
        setTimeout(() => {
            w1.scrollTo({ top: 35, behavior: 'smooth' });
            w2.scrollTo({ top: 35, behavior: 'smooth' });
            
            setTimeout(() => {
                // Return to center if user hasn't taken over control yet
                if (!wrap1.classList.contains('user-scrolled')) w1.scrollTo({ top: 0, behavior: 'smooth' });
                if (!wrap2.classList.contains('user-scrolled')) w2.scrollTo({ top: 0, behavior: 'smooth' });
            }, 500);
        }, 600);
    }

    async function init() {
        try {
            // Fallback mock data if JSON files aren't available locally
            let mapRes, countriesRes;
            try {
                [mapRes, countriesRes] = await Promise.all([
                    fetch('contentMap.json'),
                    fetch('countries.json')
                ]);
                contentMap = await mapRes.json();
                countries = await countriesRes.json();
            } catch(e) {
                console.warn("Using fallback local data.");
                countries = ["Japan", "France", "Brazil", "Egypt", "Canada"];
                contentMap = {"Etiquette:Japan": "Bow when greeting others."};
            }

            build(w1, cultures);
            build(w2, countries);

            w1.addEventListener('scroll', update);
            w2.addEventListener('scroll', update);

            update();
            
            // Run the introductory nudge
            nudgeWheels();

        } catch (error) {
            console.error("Initialization error:", error);
            desc.innerText = "Error loading data.";
        }
    }

    window.onload = init;
</script>
</body>
</html>
